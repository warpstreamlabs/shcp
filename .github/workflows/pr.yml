name: Lint Charts

on: pull_request

# Charts are only linted, not installed, because CI can't pull the private control plane image.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          workflow_changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD -- .github/workflows/pr.yml)
          if [[ -n "$changed" || -n "$workflow_changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$workflow_changed" ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          extra_args=()
          if [[ "${{ steps.list-changed.outputs.all }}" == "true" ]]; then
            extra_args+=(--all)
          fi
          ct lint --target-branch ${{ github.event.repository.default_branch }} "${extra_args[@]}"
